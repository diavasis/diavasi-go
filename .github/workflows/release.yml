name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Check the tag and build
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./scripts/publish.sh
